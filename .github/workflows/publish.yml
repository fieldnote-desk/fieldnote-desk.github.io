name: Publish edition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'site/**'
      - 'app/**'
      - 'scripts/**'
      - 'sources.json'
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
      timezone: Asia/Hong_Kong

permissions: {}

concurrency:
  group: fieldnote-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
      pages: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/cache@v4
        id: flutter-web
        with:
          path: app/build/web
          key: flutter-web-3.50.1-${{ hashFiles('app/lib/**', 'app/web/**', 'app/pubspec.*', 'scripts/web-assets.sh') }}
      - name: Build the Flutter site
        if: steps.flutter-web.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/fieldnote-flutter"
          bash scripts/web-assets.sh
          export PATH="$RUNNER_TEMP/fieldnote-flutter/bin:$PATH"
          export FLUTTER_SUPPRESS_ANALYTICS=true
          cd app
          flutter pub get
          flutter build web --release --pwa-strategy=none --no-web-resources-cdn --no-pub
      - run: python -m pip install -r scripts/requirements.txt
      - name: Build the rolling edition
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEWS_MODEL_GROK: ${{ vars.NEWS_MODEL_GROK }}
          NEWS_MODEL_CHATGPT: ${{ vars.NEWS_MODEL_CHATGPT }}
          NEWS_MODEL_GEMINI: ${{ vars.NEWS_MODEL_GEMINI }}
          NEWS_MODEL_CLAUDE: ${{ vars.NEWS_MODEL_CLAUDE }}
          NEWS_MODEL_DEEPSEEK: ${{ vars.NEWS_MODEL_DEEPSEEK }}
        run: |
          mkdir -p dist
          cp -a app/build/web/. dist/
          cp app/assets/OFL.txt dist/font-license.txt
          python scripts/refresh.py \
            --previous-url "${PAGES_BASE%/}/feed.json?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Remove temporary deployment artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TEMP_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        if: ${{ success() && needs.build.outputs.artifact-id != '' }}
        continue-on-error: true
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TEMP_ARTIFACT_ID}"
