<!doctype html>
<html lang="zh-Hans">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f6faef">
  <title>新闻简报</title>
  <script>
    try {
      if (localStorage.getItem('fieldnote-dark-mode') === 'true') {
        document.documentElement.dataset.mode = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#171d15';
      }
    } catch {}
  </script>
  <style>
    html { --paper:#f6faef;--ink:#25331f;--accent:#416f28;--wash:#e3f1d5;color-scheme:light }
    html[data-mode="dark"] { --paper:#171d15;--ink:#edf4e9;--accent:#b8e38e;--wash:#283721;color-scheme:dark }
    html { background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif }
    #loading { position:fixed;inset:0;display:grid;place-items:center;text-align:center;
      background:radial-gradient(ellipse at center,var(--wash),var(--paper) 65%) }
    .loading-mark { display:grid;gap:8px;padding:24px;width:84px;margin:0 auto 20px;
      border-radius:26px;background:var(--paper);box-shadow:0 14px 42px #21391720;
      animation:float 1.7s ease-in-out infinite alternate }
    .loading-mark i { display:block;height:4px;border-radius:3px;background:var(--accent);
      transform-origin:left;animation:write 1.7s ease-in-out infinite alternate }
    .loading-mark i:nth-child(2) { width:80%;animation-delay:.12s }
    .loading-mark i:nth-child(3) { width:58%;animation-delay:.24s }
    .loading-title { margin:0;font-weight:720;font-size:22px;letter-spacing:.08em }
    #loading-status { margin:8px 0;color:var(--accent);font-size:14px }
    #loading button { border:1px solid var(--accent);color:var(--ink);background:var(--paper);
      border-radius:18px;padding:7px 15px;margin-top:6px;font:inherit;cursor:pointer }
    #loading[data-error] i,#loading[data-error] .loading-mark { animation:none }
    @keyframes float { to { transform:translateY(-7px) } }
    @keyframes write { 0%,15% { transform:scaleX(.2);opacity:.35 } 75%,100% { transform:scaleX(1) } }
    @media (prefers-reduced-motion: reduce) { .loading-mark,.loading-mark i { animation:none } }
  </style>
</head>
<body>
  <div id="loading">
    <div>
      <div class="loading-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="loading-title">新闻简报</p>
      <p id="loading-status" role="status">正在打开…</p>
      <button id="loading-retry" type="button" hidden onclick="location.reload()">重新加载</button>
      <noscript><p>请启用 JavaScript 以打开新闻简报。</p></noscript>
    </div>
  </div>
  <script>
    window.fieldnoteLoadError = () => {
      const loader = document.getElementById('loading');
      if (!loader) return;
      loader.dataset.error = '';
      document.getElementById('loading-status').textContent = '暂时无法打开，请重试';
      document.getElementById('loading-retry').hidden = false;
    };
    const loadingTimeout = setTimeout(window.fieldnoteLoadError, 60000);
    window.addEventListener('flutter-first-frame', () => {
      clearTimeout(loadingTimeout);
      document.getElementById('loading')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async onerror="window.fieldnoteLoadError()"></script>
</body>
</html>
